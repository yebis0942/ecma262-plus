name: build-deploy

on:
  schedule:
    - cron: '17 4 * * *' # daily
  workflow_dispatch: {}
  push:
    branches: [main]

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: site

      # SITE_TOOLS_REF is a repo Actions variable (default main); pin it via
      # `gh variable set SITE_TOOLS_REF --body <sha>` to roll the build tooling
      # back to a known-good commit without touching this repo.
      - uses: actions/checkout@v4
        with:
          repository: yebis0942/ecma262-site-tools
          ref: ${{ vars.SITE_TOOLS_REF || 'main' }}
          path: site-tools

      # ECMA262_REF is a repo Actions variable (default main); pin it via
      # `gh variable set ECMA262_REF --body <sha>` when upstream breaks the build.
      - uses: actions/checkout@v4
        with:
          repository: tc39/ecma262
          ref: ${{ vars.ECMA262_REF || 'main' }}
          path: ecma262

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site-tools/package-lock.json

      - name: Record build provenance
        run: |
          echo "SPEC_REV=$(git -C ecma262 rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "TOOLS_REV=$(git -C site-tools rev-parse HEAD)" >> "$GITHUB_ENV"

      # site-tools pins ecmarkup as an npm dependency, so there is nothing to
      # build from source. ecma262 needs no install at all: the build wrapper
      # reads spec.html directly (emu-import is resolved at build time).
      # Dev dependencies are required — the data generator runs under tsx.
      - name: Install the build wrapper
        run: |
          cd site-tools
          npm ci
          node -e 'console.log("using ecmarkup", require("ecmarkup/package.json").version)'

      # The published editions are immutable, so a warm cache means zero
      # traffic to 262.ecma-international.org.
      - name: Cache version-bar edition downloads
        uses: actions/cache@v4
        with:
          path: site-tools/.version-cache
          key: version-bar-v2-${{ hashFiles('site-tools/scripts/version-bar-config.json') }}
          restore-keys: version-bar-v2-

      - name: Generate version-bar data
        id: vbar
        continue-on-error: true
        run: |
          cd site-tools
          npm run generate-version-bar-data -- \
            --spec-html "$GITHUB_WORKSPACE/ecma262/spec.html" \
            --out-dir "$RUNNER_TEMP/version-bar"

      - name: Decide version-bar flags
        id: vbarflags
        run: |
          manifest="$RUNNER_TEMP/version-bar/version-bar-manifest.json"
          # The manifest is written last, so a half-finished run leaves none.
          # Check the schema too: ecma262-build throws on anything but v2, which
          # would fail the whole build rather than degrade.
          if node -e 'const m = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
                      process.exit(m.schemaVersion === 2 && Object.keys(m.sections).length > 0 ? 0 : 1);' \
                   "$manifest" 2>/dev/null; then
            echo "flags=--version-bar $manifest" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::version-bar data unusable (generate step: ${{ steps.vbar.outcome }}); building without the version bar"
            echo "flags=" >> "$GITHUB_OUTPUT"
          fi

      # ecma262-build injects the widgets with per-page relative paths (so the
      # site works under the /ecma262-plus/ prefix and on multipage subpages)
      # and copies the widget data (version-bar-data/, impl-links.json) into
      # the output itself. img/ is ecma262's own resource, which ecmarkup does
      # not handle — the official build copies it with `cp -R img out`.
      - name: Build the spec
        run: |
          cd site-tools
          npx ecma262-build "$GITHUB_WORKSPACE/ecma262/spec.html" "$GITHUB_WORKSPACE/out" \
            --multipage --verbose \
            --copy "$GITHUB_WORKSPACE/ecma262/img" \
            ${{ steps.vbarflags.outputs.flags }}

      - name: Inject banner and robots
        run: |
          node site/scripts/postprocess.mjs out \
            --spec-rev "$SPEC_REV" --tools-rev "$TOOLS_REV" \
            --ecmarkup-version "$(node -p "require('./site-tools/package.json').dependencies.ecmarkup")" \
            --impl-links out/impl-links.json
          printf 'User-agent: *\nDisallow: /\n' > out/robots.txt
          du -sh out

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  # Skipped unless the DEPLOY_ENABLED repo variable is 'true'; see README.
  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
